[build]
  publish = "public"
  command = "node scripts/strip-image-metadata.js public/images"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Image proxy removed — resolveImageUrl() in app.js/admin.js now points
# directly to workers.dev, so no Netlify bandwidth is used for images.
# Uploads in admin.js also go directly to workers.dev.
